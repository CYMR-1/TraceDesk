[package]
name = "tracedesk-core"
version.workspace = true
edition.workspace = true

[features]
# 默认开启安全图片预览（桌面端启用；CLI 与 MCP 可通过 default-features = false 裁剪 image/base64）
default = ["image-preview"]
image-preview = ["dep:image", "dep:base64"]

[dependencies]
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "ico"] }
memchr = "2"
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracedesk-engines = { path = "../tracedesk-engines" }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
